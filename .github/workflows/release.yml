name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. See README > Signing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FPLBP_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          FPLBP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FPLBP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FPLBP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: |
          VERSION="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "FPLBP-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: FPLBP ${{ env.VERSION }}
          body: |
            Instaliraj FPLBP-${{ env.VERSION }}.apk preko stare verzije, podaci ostaju.
            Commit: ${{ github.event.head_commit.message }}
          files: FPLBP-${{ env.VERSION }}.apk
          make_latest: true
